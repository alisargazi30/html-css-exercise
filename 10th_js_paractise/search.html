  <main class="search-page">

      <h1 class="page-title">جستجوی غذا</h1>

      <!-- ======== باکس جستجو (تصویر شماره ۱) ========
           در حالت عادی فقط دکمه ذره‌بین دیده می‌شود؛ با کلیک روی آن،
           کادر جستجو با انیمیشن باز می‌شود. -->
      <div class="search-bar" id="search_bar">
        <button class="search-toggle" id="search_toggle" type="button" title="جستجو">
          <span class="icon-search">🔍</span>
        </button>

          </button>
        </div>

        <button class="search-close" id="search_close" type="button" title="بستن">✕</button>
      </div>

      <!-- ======== نتیجه جستجو (تصویر شماره ۲) ======== -->

        <h2 class="search-result__title">نتیجه جستجوی شما :</h2>
        <div id="result_body"></div>
